<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoomBook</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <h1>RoomBook</h1>
    <div id="session-bar" class="session-bar" hidden>
      <span id="session-user"></span>
      <button type="button" id="logout-button">Sign out</button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <!-- Signed out: FR-001 register, FR-002 sign in -->
    <section id="auth-view" aria-labelledby="auth-heading">
      <h2 id="auth-heading">Sign in or create an account</h2>
      <div class="columns">
        <form id="login-form" class="card" novalidate>
          <h3>Sign in</h3>
          <p class="form-error" data-error-for="_form"></p>
          <label for="login-email">University email</label>
          <input id="login-email" name="email" type="email" autocomplete="username" required>
          <p class="field-error" data-error-for="email"></p>
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          <p class="field-error" data-error-for="password"></p>
          <button type="submit">Sign in</button>
        </form>

        <form id="register-form" class="card" novalidate>
          <h3>Create an account</h3>
          <p class="form-error" data-error-for="_form"></p>
          <label for="register-email">University email</label>
          <input id="register-email" name="email" type="email" autocomplete="email" maxlength="254" required>
          <p class="field-error" data-error-for="email"></p>
          <label for="register-name">Display name</label>
          <input id="register-name" name="displayName" type="text" autocomplete="nickname" maxlength="60" required>
          <p class="field-error" data-error-for="displayName"></p>
          <label for="register-password">Password (12–128 characters)</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
          <p class="field-error" data-error-for="password"></p>
          <button type="submit">Create account</button>
        </form>
      </div>
    </section>

    <!-- Signed in -->
    <div id="app-view" hidden>
      <nav class="section-nav" aria-label="Sections">
        <a href="#rooms-section">Find a room</a>
        <a href="#mine-section">My bookings</a>
      </nav>

      <!-- FR-005 room list with filters -->
      <section id="rooms-section" aria-labelledby="rooms-heading">
        <h2 id="rooms-heading">Find a room</h2>
        <form id="room-filter-form" class="card" novalidate>
          <p class="form-error" data-error-for="_form"></p>
          <div class="columns">
            <div>
              <label for="filter-capacity">Minimum capacity</label>
              <input id="filter-capacity" name="minCapacity" type="number" min="1" max="50" inputmode="numeric">
              <p class="field-error" data-error-for="minCapacity"></p>
            </div>
            <div>
              <label for="filter-building">Building</label>
              <input id="filter-building" name="building" type="text" maxlength="60">
              <p class="field-error" data-error-for="building"></p>
            </div>
          </div>
          <fieldset>
            <legend>Required equipment</legend>
            <label class="inline"><input type="checkbox" name="equipment" value="whiteboard"> Whiteboard</label>
            <label class="inline"><input type="checkbox" name="equipment" value="projector"> Projector</label>
            <label class="inline"><input type="checkbox" name="equipment" value="display-screen"> Display screen</label>
            <label class="inline"><input type="checkbox" name="equipment" value="video-conferencing"> Video conferencing</label>
          </fieldset>
          <p class="field-error" data-error-for="equipment"></p>
          <button type="submit">Search rooms</button>
        </form>
        <ul id="room-list" class="plain card" aria-live="polite"></ul>
      </section>

      <!-- FR-006 availability, FR-009 booking -->
      <section id="book-section" aria-labelledby="book-heading" hidden>
        <h2 id="book-heading">Book <span id="book-room-name"></span></h2>
        <form id="availability-form" class="card" novalidate>
          <p class="form-error" data-error-for="_form"></p>
          <label for="availability-date">Date (campus time)</label>
          <input id="availability-date" name="date" type="date" required>
          <p class="field-error" data-error-for="date"></p>
          <button type="submit">Show availability</button>
        </form>
        <div id="availability" class="card" aria-live="polite">
          <h3>Availability</h3>
          <p id="availability-summary" class="muted"></p>
          <div class="columns">
            <div><h4>Free</h4><ul id="free-list" class="plain"></ul></div>
            <div><h4>Booked</h4><ul id="booked-list" class="plain"></ul></div>
          </div>
        </div>
        <form id="booking-form" class="card" novalidate>
          <h3>New booking</h3>
          <p class="form-error" data-error-for="_form"></p>
          <p class="field-error" data-error-for="roomId"></p>
          <div class="columns">
            <div>
              <label for="booking-start">Start</label>
              <select id="booking-start" name="start" required></select>
              <p class="field-error" data-error-for="start"></p>
            </div>
            <div>
              <label for="booking-end">End</label>
              <select id="booking-end" name="end" required></select>
              <p class="field-error" data-error-for="end"></p>
            </div>
            <div>
              <label for="booking-party">Party size</label>
              <input id="booking-party" name="partySize" type="number" min="1" max="50" value="1" inputmode="numeric" required>
              <p class="field-error" data-error-for="partySize"></p>
            </div>
          </div>
          <label for="booking-purpose">Purpose (optional, up to 100 characters)</label>
          <input id="booking-purpose" name="purpose" type="text" maxlength="100">
          <p class="field-error" data-error-for="purpose"></p>
          <button type="submit">Book this slot</button>
        </form>
      </section>

      <!-- FR-013 my bookings -->
      <section id="mine-section" aria-labelledby="mine-heading">
        <h2 id="mine-heading" tabindex="-1">My bookings</h2>
        <div class="card">
          <label class="inline" for="mine-include-all"><input type="checkbox" id="mine-include-all"> Show cancelled and past bookings</label>
          <ul id="mine-list" class="plain" aria-live="polite"></ul>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
